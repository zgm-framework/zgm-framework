[package]
name = "zgm-limits"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Attempt limits (sign-in, codes, exports) counted in PostgreSQL: one statement per attempt, rules a tenant can override, a list of blocked keys, audit events"
authors = ["Paweł Zygmunt"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zgm-framework/zgm-framework"
keywords = ["rate-limit", "postgres", "sqlx", "security", "multitenancy"]
categories = ["web-programming", "database", "authentication"]
# Not published on crates.io: the crate is used as a git dependency for now.
publish = false

[dependencies]
async-trait = "=0.1.92"
bon = "=3.10.2"
chrono = { version = "=0.4.45", default-features = false, features = ["now"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "chrono", "uuid"] }
strum = { version = "=0.28.0", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros", "time"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
tokio = { version = "=1.54.1", default-features = false, features = ["test-util"] }
